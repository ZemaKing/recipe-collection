name: CI

# ROADMAP Phase 42: lint, type-check, unit tests and the production build gate every push to
# main and every PR (copied from the game app). The E2E suite (`npm run test:e2e`) runs locally:
# it needs the live Supabase project and Edge (e2e/README.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not the game app's 22: the scripts/ .ts files rely on Node 24's type stripping.
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Public values, already in vercel.json's CSP: postbuild's check-csp.mjs needs the real
          # URL that index.html preconnects to. The key is a placeholder (nothing runs against it).
          VITE_SUPABASE_URL: https://laapabfzldjerljmthgn.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
